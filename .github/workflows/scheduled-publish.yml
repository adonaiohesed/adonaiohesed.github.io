name: "Scheduled Publish"

on:
  schedule:
    # 14:00 UTC is 08:00 CST / 09:00 CDT; eligibility uses America/Chicago.
    - cron: '0 14 * * *'
  workflow_dispatch: # Allows manual trigger for testing

concurrency:
  group: scheduled-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move eligible posts
        id: move-posts
        run: python3 scripts/publish_scheduled_posts.py

      - name: Commit and Push
        if: steps.move-posts.outputs.moved == 'true'
        run: |
          git config --global user.name "Hyoeun Choi"
          git config --global user.email "adonaiohesed@gmail.com"
          
          # Get the list of moved files for the commit message
          LIST_OF_FILES=$(git status --short _posts/ | awk '{print $2}' | xargs -I {} basename {} | paste -sd ", " -)
          
          git add _posts/ _pending_posts/
          git commit -m "Published: $LIST_OF_FILES on $(date +%Y-%m-%d)"
          git push

      # GITHUB_TOKEN pushes do not trigger the separate push-based Pages workflow.
      - name: Deploy published posts
        if: steps.move-posts.outputs.moved == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_REF: ${{ github.ref_name }}
        run: gh workflow run pages-deploy.yml --ref "$PUBLISH_REF"
